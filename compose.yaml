# Unifórmame · Postgres 18 y el almacén compatible con S3 en Docker para `pnpm local`.
# Fase 2 y fase 4 · docs/cimientos/ARQUITECTURA.md («Cómo corre en local»). Solo escuchan en esta
# máquina; las claves son las de contenedores locales, no secretos.
services:
  base:
    image: postgres:18
    environment:
      POSTGRES_USER: uniformame_dueno
      POSTGRES_PASSWORD: dueno
      POSTGRES_DB: uniformame
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - base:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "uniformame_dueno", "-d", "uniformame"]
      interval: 2s
      retries: 30
  # El almacén de archivos en local: versitygw, compatible con S3 (decisión 361), con la región de R2.
  almacen:
    image: versity/versitygw:v1.9.0
    command: ["posix", "/datos"]
    environment:
      ROOT_ACCESS_KEY: uniformame
      ROOT_SECRET_KEY: uniformame-local
      VGW_REGION: auto
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - almacen:/datos
volumes:
  base:
  almacen:
